# yaml-language-server: $schema=https://raw.githubusercontent.com/lorem-dev/duolog/main/duolog-config.schema.json
# duolog default rules. Lowest config layer; override per project in .duolog/config.yaml.
# Evidence and sources: docs/research/2026-10-30-practices-and-models.md
# and docs/research/2026-10-30-live-verification.md
version: 1
skill_tests: ask

# Co-Authored-By lines for commits that hold a worker's changes. Set enabled
# to false when the repository's rules forbid such lines.
coauthors:
  enabled: true
  claude: "{name} <noreply@anthropic.com>"
  codex: "OpenAI Codex {model} <noreply@openai.com>"

# Claude workers, peers and the lead (set by duolog install) compact at this
# context size (tokens). auto reads the Claude plan and takes the window from
# compact_ladder; a plan not listed, or none read, gets the smallest value. 0
# leaves Claude's own default.
workers:
  compact_window: auto
  compact_ladder:
    pro: 250000
    max: 500000
    ultra: 700000

# Claude compacts a long lead session; this keeps the delegation state in the
# summary and lists the live peers again afterwards.
lead:
  compact_notes: true
  fresh_session_hint: 200000 # context tokens from which an idle Claude lead is reminded to offer a fresh session; 0 is off

wire:
  max_summary_bytes: 200
  max_line_bytes: 512
  inline_max_bytes: 65536  # duolog puts the task and its Read files in the worker's stdin up to this size

limits:
  manual_only_models: [fable, astra]  # refused unless --allow-manual-model is passed
  max_live_sessions: 1     # per lead and agent; one-shot `fresh` runs do not count
  self_max_read_files: 3   # on a provider limit, the lead does a task this small itself
  self_max_read_lines: 200 # otherwise its own subagent does it
  # Live sessions per account, across every lead and project: running workers
  # and open peer panes. The shared .duolog/config.yaml may only lower these.
  max_total_sessions: 10   # all agents together
  sessions_by_tier:        # per agent, by its measured window; only your user config may raise them
    small: 3               # unmeasured, paid, workspace, or a small plan
    medium: 5              # a window about 5 times larger
    large: 10              # a window about 20 times larger
  session_wait_seconds: 60 # a delegation waits this long for a free slot

# How far quota reads and learned window rates are trusted. The shared
# .duolog/config.yaml may only make these stricter.
balance:
  max_age_seconds: 120     # an older quota read is read again or counts as paid
  min_interval_share: 0.05 # window movement of one measured interval
  margin: 0.2              # a tier steps up only this far past its cut

# Balance subscriptions by pace: a new task of a role whose `use` agent runs
# ahead of its weekly window starts on the role's `fallback` agent while that
# agent is on pace and billed by subscription. The shared .duolog/config.yaml
# may not turn it off or raise the margin.
routing:
  balance: pace            # pace, or off for the ladder as written
  margin: 0.10             # used share may pass elapsed share by this much
  agent_order: [claude, codex] # who takes a task whose role names no other agent
  small_task_files: 2      # a writing task whose Write names at most this many files runs in the lead; 0 is off

# The built-in agents are on. A third registered agent is off until its entry
# says enabled: true.
agents:
  claude: {enabled: true}
  codex: {enabled: true}

# Aliases only. Claude Code resolves its own. For Codex, duolog picks the newest visible
# gpt-<version>-<family> in `codex debug models`. A full name in a role is a deliberate pin.
# Prices are USD per 1M tokens, read from vendor pages on 2026-10-30, for the version in
# priced_for. They drive admission of paid runs against paid_runs.<agent>.daily_cap_usd,
# and the estimates of `duolog stats` and `duolog doctor`. They leave out fast mode and
# cloud surcharges, so a paid run's cost is a lower bound.
models:
  fable:  {agent: claude, priced_for: claude-fable-5-1,  input: 10.00, cached: 0.25, output: 50.00}
  opus:   {agent: claude, priced_for: claude-opus-5-5,   input: 4.00,  cached: 0.20, output: 20.00}
  sonnet: {agent: claude, priced_for: claude-sonnet-5-5, input: 2.00,  cached: 0.10, output: 10.00}
  haiku:  {agent: claude, priced_for: claude-haiku-5-5,  input: 0.10,  cached: 0.01, output: 0.50, note: "x5 above a 100K token prompt"}
  astra:  {agent: codex, family: astra, priced_for: gpt-6-astra,   input: 10.00, cached: 1.00, output: 50.00}
  sol:    {agent: codex, family: sol,   priced_for: gpt-6.1-sol,   input: 2.00,  cached: 0.10, output: 10.00}
  terra:  {agent: codex, family: terra, priced_for: gpt-6.1-terra, input: 1.00,  cached: 0.05, output: 5.00}
  luna:   {agent: codex, family: luna,  priced_for: gpt-6-luna,    input: 0.10,  cached: 0.01, output: 0.50}

# effort is what the role asks for. The lead's effort is the maximum: a worker never runs above it.
# Default roles stop at high because gpt-6.1-sol's DeepSWE score falls above it; a project may set more.
# context: minimal drops project instructions (about 8,400 Codex input tokens per call in a large repo)
#          project keeps them; use it for anything that changes or judges code
# session: fresh is a new run per task
#          resume continues the thread, and runs in the lead itself when agent and model match
roles:
  plan:
    use: {agent: claude, model: opus, effort: high}
    fallback: {agent: codex, model: sol, effort: high}
    sandbox: read-only
    context: project
    session: resume
  # A whole feature: investigate, plan, implement, check, report risks. Keeps its
  # thread so follow-up rounds reuse the worker's cached context.
  planner:
    use: {agent: codex, model: sol, effort: medium}
    fallback: {agent: claude, model: sonnet, effort: medium}
    sandbox: workspace-write
    context: minimal
    session: resume
    balance: false          # stays on Codex while it can run; pace never moves it
  implement:
    use: {agent: codex, model: sol, effort: medium}
    fallback: {agent: claude, model: sonnet, effort: medium}
    sandbox: workspace-write
    context: project
    session: fresh
  implement_complex:
    use: {agent: codex, model: sol, effort: high}
    fallback: {agent: claude, model: opus, effort: high}
    sandbox: workspace-write
    context: project
    session: fresh
  mechanical:           # search, data gathering, repeated edits
    use: {agent: codex, model: luna, effort: low}
    fallback: {agent: claude, model: haiku, effort: low}
    sandbox: workspace-write
    context: minimal
    session: fresh
  tests:
    use: {agent: codex, model: terra, effort: medium}
    fallback: {agent: claude, model: sonnet, effort: medium}
    sandbox: workspace-write
    context: project
    session: fresh
  # In the cost study sol made no false findings on reviews; terra cost half as
  # much but made a false one in half of its runs.
  review_intermediate:
    use: {agent: codex, model: sol, effort: medium}
    fallback: {agent: claude, model: sonnet, effort: medium}
    sandbox: read-only
    context: project
    session: fresh
  review_final:
    use: {agent: claude, model: opus, effort: high}
    fallback: {agent: codex, model: sol, effort: high}
    sandbox: read-only
    context: project
    session: fresh
  # Reviews what the other vendor wrote, at the end of a large batch. Pace never
  # moves it off Codex while Codex can run.
  review_cross:
    use: {agent: codex, model: sol, effort: high}
    fallback: {agent: claude, model: opus, effort: high}
    sandbox: read-only
    context: project
    session: fresh
    balance: false
  # Finding a cause by reading one repository. In the cost study sol found it on
  # four hard bugs at every effort, for a third to a sixteenth of what opus cost.
  debug:
    use: {agent: codex, model: sol, effort: medium}
    fallback: {agent: claude, model: opus, effort: high}
    sandbox: read-only
    context: project
    session: resume
  # Several components, logs or other evidence from outside the repository.
  debug_hard:
    use: {agent: claude, model: opus, effort: high}
    fallback: {agent: codex, model: sol, effort: high}
    sandbox: workspace-write
    context: project
    session: resume
  security_review:
    use: {agent: claude, model: opus, effort: high}
    fallback: {agent: codex, model: sol, effort: high}
    sandbox: read-only
    context: project
    session: fresh
  docs:
    use: {agent: claude, model: sonnet, effort: medium}
    fallback: {agent: codex, model: terra, effort: medium}
    sandbox: workspace-write
    context: minimal
    session: fresh

sessions:
  resume_max_input_tokens: 150000  # sum over all model calls; above this, close the thread and start fresh
  idle_close_minutes: 30

# Decided by the duolog binary, not by a model, so an ordinary decision costs no tokens.
# A worker never gets more than the lead's own settings allow, and it never delegates.
# An unanswered question is denied when ask_timeout_seconds ends, or
# person_ask_timeout_seconds for one only the person can answer.
# The lead's mode adds to this: denies first, then the role's limit, then the mode.
policy:
  on_unmatched: ask
  ask_timeout_seconds: 120
  person_ask_timeout_seconds: 600
  rules:
    # CodeGraph reads only the code index. Exact names cover every role and
    # Codex's folded MCP names; a wildcard does not match those tool names.
    - {action: mcp, match: "codegraph/codegraph_search", decision: allow}
    - {action: mcp, match: "codegraph/codegraph_context", decision: allow}
    - {action: mcp, match: "codegraph/codegraph_explore", decision: allow}
    - {action: mcp, match: "codegraph/codegraph_node", decision: allow}
    - {action: mcp, match: "codegraph/codegraph_callers", decision: allow}
    - {action: mcp, match: "codegraph/codegraph_callees", decision: allow}
    - {action: mcp, match: "codegraph/codegraph_impact", decision: allow}
    - {action: mcp, match: "codegraph/codegraph_files", decision: allow}
    - {action: mcp, match: "codegraph/codegraph_status", decision: allow}
    - {action: read,  match: "**", decision: allow}
    - {action: read,  match: "{**/.env,**/.env.*,**/*.pem,**/*.key,**/secrets/**}", decision: deny}
    - {action: write, match: "{**/.duolog/**,**/.git,**/.git/**}", decision: deny}
    # A worker that changes these would change its own rules or the lead's hooks.
    # Codex itself keeps .codex/ read-only in workspace-write.
    - {action: write, match: "{.claude/settings*.json,.claude/hooks/**,.codex/**}", decision: deny}
    - {action: write, match: "**", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    # Not run: go run and uv run start any program. A named test or lint script is fine.
    - {action: exec,  match: "{go,cargo,npm,pnpm,uv,task,make} {test,lint,fmt,build}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "{npm,pnpm} run {test,lint,fmt,build}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "{npm,pnpm} run {type,typecheck,type:*}", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "uv run {pytest,ruff,ty,mypy,pyright,basedpyright}{, *}", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    # Check tools as agents call them, per ecosystem. Writer roles only: these run
    # project code or config (eslint configs, build scripts, test files).
    - {action: exec,  match: "{./,}node_modules/.bin/{tsc,vue-tsc,eslint,prettier,biome,vitest,jest}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "{.venv/bin/,}{pytest,ruff,black,mypy,pyright,basedpyright,ty}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "{python,python3,.venv/bin/python} -m {pytest,ruff,mypy,black}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "{go vet,go build,gofmt,staticcheck,golangci-lint run}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "cargo {check,clippy,fmt,nextest}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "{clang-format,clang-tidy,cppcheck,ctest,cmake --build,ninja -C}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "make {check,typecheck,vet,format}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "{./gradlew,gradle} --offline {test,check,build}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "{./mvnw,mvn} -o {test,verify,compile}*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "dotnet {build,test} --no-restore*", decision: allow, roles: [planner, implement, implement_complex, mechanical, tests, docs, debug_hard]}
    - {action: exec,  match: "git {status,diff,log,show,worktree list}*", decision: allow}
    # No trailing star: other uses of branch and rev-parse can write or name files.
    - {action: exec,  match: "git {branch --show-current,rev-parse --abbrev-ref HEAD}", decision: allow}
    - {action: exec,  match: "{cat,head,tail,ls,pwd,wc,rg,grep,find,sed,jq,stat,file,du,tree,cut,nl,comm,cmp,sort,uniq,realpath,which,basename,dirname,shasum,md5,Get-Content,Get-ChildItem,Get-Location,Test-Path,Select-String,Get-Item}*", decision: allow}
    - {action: exec,  match: "git {push,reset --hard,clean,rebase}*", decision: deny}
    - {action: exec,  match: "rm -rf *", decision: deny}
    # A worker that starts an agent runs outside duolog's routing and quota.
    - {action: exec,  match: "{claude,codex}", decision: deny}
    - {action: exec,  match: "{claude,codex} *", decision: deny}
    - {action: exec,  match: "remove-item -recurse *", decision: deny}
    - {action: net,   match: "*", decision: ask}

# What to do when the target agent lacks a skill, MCP server or plugin the task needs.
# read_source: tell the worker to read the skill's SKILL.md by absolute path.
# lead_first: start nothing; the lead does that part and passes the result as an artifact.
# reroute: give the role to the agent that has it. refuse: stop with the name.
capabilities:
  # mcp: bridge hands the lead's server, with its credentials, to a worker of
  # the other agent for one run. It is off by default for that reason.
  on_missing: {skill: read_source, mcp: lead_first, plugin: lead_first}
  hints: {}             # name: a one-line hint that replaces the default text
  mcp_tools: {}         # server: [tool, ...]; limits what a bridged server offers
  # A worker that cannot sign in: login_then_lead runs the agent's own login
  # once, then hands the task to the lead; lead hands it over at once; fail stops.
  on_auth_failure: login_then_lead
  login_timeout_seconds: 180

# `duolog sync --from claude|codex` picks the direction; hooks then keep the target up to date.
# Skills and agents are always generated as plain files, never symlinks.
sync:
  auto: true            # PostToolUse and SessionStart hooks; does nothing until a direction is chosen
  agents:
    model_map:          # claude alias: codex alias; the reverse direction inverts it
      fable: astra
      opus: sol
      sonnet: terra
      haiku: luna
    default_effort: {fable: high, opus: high, sonnet: medium, haiku: low}
    effort_map: {low: low, medium: medium, high: high, xhigh: xhigh, max: max, ultra: max}
    codex_name: keep    # keep | underscore; Codex was seen to accept a hyphen
    drop_keys: [color]  # any other key with no counterpart refuses, so nothing is lost silently
    overrides: {}       # per agent, e.g. architect: {model: sol, effort: medium}
  skills:
    drop_keys: []       # frontmatter keys to remove; other keys stay

# Variables spawned sessions inherit. Everything else is not passed on purpose.
# Defaults come from the OS and include native login and CLI config variables.
# A free run drops names that bill per token, such as API keys, even when this
# list names them; see paid_runs below.

rex:
  stuck_notify_minutes: 5
  auto_answers:
    - match: Hooks need review
      answer: Continue without trusting
  capture_lines: 20         # a capture checks state only; answers are read from files
  start_timeout_seconds: 120

# Local telemetry: run, quota, routing and gate figures, never text. It stays on
# this machine and nothing uploads it. User level only, except that a project
# may set enabled: false to stop its own events; DUOLOG_TELEMETRY=off turns it
# off everywhere. Turning it off stops writes; pruning goes on until the data is gone.
telemetry:
  enabled: true
  retention_days: 30      # 1..30; a project layer cannot change it
  prune_every_hours: 6
  max_megabytes: 16

# Learning mode: each delegation gets a task class, and the class picks the target.
# duolog keeps a local journal in .duolog/journal/ and changes the order of a ladder
# only when you approve `duolog learn`. See docs/learning.md.
# prior is a guessed quality, 0 to 3, worth prior_runs judged runs. Efforts stop at high:
# the cost study saw no quality gain above it.
learning:
  enabled: false
  threshold: 2.5          # cost-first: the cheapest entry whose quality minus margin reaches this
  quality_margin: 0.25    # quality-first: a cheaper entry this close to the best one wins
  prior_runs: 2
  uncertainty: 0.5        # margin = uncertainty / sqrt(prior_runs + judged weight)
  profile_below_runs: 3   # task finish offers to profile an entry with less judged weight
  judges:                 # the first whose agent neither side used; else the first, order shuffled
    - {agent: claude, model: opus, effort: high}
    - {agent: codex, model: sol, effort: high}
  classify:               # first match wins; no match keeps the role's own target
    - {when: {role: planner}, class: feature}
    - {when: {output: plan}, class: skeleton}
    - {when: {exemplar: "no", output: code}, class: skeleton}
    - {when: {output: review, target: plan}, class: plan_review}
    - {when: {outside_evidence: "yes"}, class: debug_multi}
    - {when: {output: diagnosis, components: "2+"}, class: debug_multi}
    - {when: {output: diagnosis}, class: debug}
    - {when: {output: tests}, class: tests}
    - {when: {output: review}, class: review}
    - {when: {output: docs}, class: docs}
    - {when: {role: mechanical}, class: mechanical}
    - {when: {output: code}, class: implement}
  classes:
    # Priors for skeleton, plan_review and debug_multi are the person's experience,
    # not measurements; experiments still to run will replace them.
    skeleton:
      description: new project, module or layer; the structure must be invented; no pattern in the code to copy
      priority: quality
      roles: [plan, review_final, implement, implement_complex]
      steps:
        plan: [{agent: claude, model: opus, effort: high, prior: 2.8}, {agent: codex, model: sol, effort: high, prior: 2.3}]
        review_final: [{agent: claude, model: opus, effort: high, prior: 2.8}, {agent: codex, model: sol, effort: high, prior: 2.3}]
      ladder: [{agent: codex, model: sol, effort: high, prior: 2.7}, {agent: claude, model: opus, effort: high, prior: 2.7}]
      rubric: [structure matches what was asked, "files, dependencies and settings nobody asked for (count)", decisions taken that should have been asked (count), templates and conventions given in advance and broken (count)]
    plan_review:
      description: find gaps, overreach and unrequested decisions in a plan or a first implementation
      priority: quality
      roles: [review_final, review_intermediate]
      ladder: [{agent: claude, model: opus, effort: high, prior: 2.8}, {agent: codex, model: sol, effort: high, prior: 2.3}]
      rubric: [real gaps found (count), invented gaps (count), unrequested decisions found (count)]
    debug_multi:
      description: the cause spans several components or needs outside evidence such as logs, stacks or dumps
      priority: quality
      roles: [debug_hard]
      ladder: [{agent: claude, model: opus, effort: high, prior: 2.8}, {agent: codex, model: sol, effort: high, prior: 2.3}]
      rubric: [root cause correct and shown with evidence, false claims (count)]
    feature:
      description: a whole feature from a brief, handed to planner, which plans, implements and checks
      priority: cost
      roles: [planner]
      ladder: [{agent: codex, model: sol, effort: medium, prior: 2.9}, {agent: codex, model: sol, effort: high, prior: 2.9}]
      rubric: &cost_rubric [correct against the tests and the brief, false claims (count)]
    implement:
      description: a change inside existing code with a clear brief and patterns to follow
      priority: cost
      roles: [implement, implement_complex]
      ladder: [{agent: codex, model: sol, effort: medium, prior: 2.9}, {agent: codex, model: sol, effort: high, prior: 2.9}, {agent: claude, model: opus, effort: high, prior: 2.9}]
      rubric: *cost_rubric
    debug:
      description: a root cause readable from one repository's code
      priority: cost
      roles: [debug, debug_hard]
      ladder: [{agent: codex, model: terra, effort: medium, prior: 2.9}, {agent: codex, model: sol, effort: medium, prior: 2.9}, {agent: claude, model: opus, effort: high, prior: 2.9}]
      rubric: *cost_rubric
    tests:
      description: tests for existing behaviour
      priority: cost
      roles: [tests]
      ladder: [{agent: codex, model: terra, effort: medium, prior: 2.9}, {agent: codex, model: sol, effort: medium, prior: 2.9}]
      rubric: *cost_rubric
    review:
      description: a review of a diff
      priority: cost
      roles: [review_intermediate, review_final, security_review]
      ladder: [{agent: codex, model: sol, effort: medium, prior: 2.9}, {agent: claude, model: opus, effort: high, prior: 2.9}]
      rubric: *cost_rubric
    mechanical:
      description: renames, moves and repetitive edits across files to a given plan
      priority: cost
      roles: [mechanical]
      ladder: [{agent: codex, model: terra, effort: low, prior: 2.9}, {agent: codex, model: terra, effort: medium, prior: 2.9}]
      rubric: *cost_rubric
    docs:
      description: documentation and changelog
      priority: cost
      roles: [docs]
      ladder: [{agent: claude, model: sonnet, effort: medium, prior: 2.9}, {agent: codex, model: terra, effort: medium, prior: 2.9}]
      rubric: *cost_rubric

# Calibration runs only when you ask the lead for it. See docs/calibration.md.
calibration:
  max_weekly_share: 0.10  # at most this share of each agent's weekly window for the whole calibration
  max_window_share: 0.5   # pause when calibration spent this share of a five-hour window
  cell_max_minutes: 45
  cell_max_tokens: 1500000
  cell_max_turns: 100
  history_days: 90        # commits of these days first, widened when a class has fewer than 3 tasks
  filter:                 # commit size after dropping generated and vendored files
    min_files: 1
    max_files: 20
    min_lines: 10
    max_lines: 400
    large_max_files: 40   # a larger stratum, only when the project's work is large
    large_max_lines: 1500

# Paid runs are off. With allow, an agent's workers and peers may run on a paid
# route, up to daily_cap_usd in the last 24 hours. The shared .duolog/config.yaml
# may only make these stricter; your user and local config may opt in.
paid_runs:
  usable_share: 0.5          # share of each window used on workspace accounts
  claude:
    allow: false             # paid runs for claude workers and peers
    daily_cap_usd: 0         # USD per 24 hours; required above 0 with allow
    calibrate: false         # calibration on a paid route, needs allow too
    env: [ANTHROPIC_API_KEY] # passed to claude processes only with allow
    account: auto            # auto, personal or workspace
    subscription_endpoints: {} # name: base URL that counts as subscription
  codex:
    allow: false
    daily_cap_usd: 0
    calibrate: false
    env: [OPENAI_API_KEY]
    account: auto
