version: "2"
run:
  build-tags: [e2e]
  # Paths in the exclusion rules are relative to go.mod, wherever the config is
  # read from (scripts/lint/exceptions.py runs a copy without the exceptions).
  relative-path-mode: gomod
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - cyclop
    - durationcheck
    - errorlint
    - funlen
    - gocheckcompilerdirectives
    - gocognit
    - gocritic
    - gosec
    - makezero
    - misspell
    - nilerr
    - nestif
    - nilnesserr
    - noctx
    - nolintlint
    - revive
    - unconvert
    - wastedassign
  settings:
    # Size and complexity limits for new code. The functions and files that
    # are over a limit today are listed under "size exceptions" below; the list
    # may only shrink (make lint-exceptions fails when a line no longer fires).
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    gocognit:
      min-complexity: 20
    cyclop:
      max-complexity: 15
      package-average: 8
    nestif:
      min-complexity: 5
    revive:
      # Only the file-length rule; the other revive rules are style.
      enable-all-rules: false
      rules:
        - name: file-length-limit
          arguments: [{max: 600, skipComments: true, skipBlankLines: true}]
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    gocritic:
      enabled-tags: [diagnostic]
      disabled-checks:
        - filepathJoin # style: it flags every Join of a variable that may hold a separator
        - sloppyReassign # style: `err = f()` versus `:=` is a matter of taste
        - ifElseChain # style
        - weakCond # every hit is `m != nil && m[1]` on a regexp submatch, which has the group when it is not nil
    gosec:
      excludes:
        - G204 # duolog starts agents and Git by design; the arguments are built from its own config
        - G304 # duolog reads files at configured paths by design
        - G104 # errcheck reports the real unchecked errors; gosec only repeats the deliberate `_ =` ones
        # Taint analysis flags every path or command that comes from config or an
        # argument, which is all of duolog's I/O. The places that take names from
        # other agents were read and are safe: artifact refs are checked hex or a
        # cleaned, symlink-free project path, and bus reader addresses reject
        # "." and ".." and go through url.PathEscape.
        - G703
        - G702
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec]
      # Sampling for the calibration runs, not a secret.
      - path: internal/calibration/
        text: G404
        linters: [gosec]
      # .duolog/, the config and the files duolog writes into a project are meant
      # to be read by the person and by Git (0755 and 0644). Telemetry and the
      # calibration trees are not in this list, so their modes stay checked.
      - path: ^(cmd|scripts)/|^internal/(agentsync|artifact|auth|bus|capability|delegate|install|journal|learning|models|peer|runner|session|store|testbin)/
        text: G30[126]
        linters: [gosec]
      # PowerShell accepts any prefix of -recurse; the arguments are in that order on purpose.
      - path: internal/gate/gate\.go
        text: argOrder
        linters: [gocritic]
      # Tests and the test binaries start short-lived commands without a context.
      - path: _test\.go|internal/testbin/
        linters: [noctx]
      # Later PR: the production calls (git and the state lookups) need a context
      # passed through project.StateRoot, profile and the git helpers, a wide
      # signature change. Excluded until then.
      - text: .
        linters: [contextcheck, noctx]
      # Tests repeat setup on purpose and may be long: no function limits, and no
      # file-length limit (peer_test.go is 1883 lines).
      - path: _test\.go
        linters: [funlen, gocognit, cyclop, nestif, revive]
      # Size exceptions: what is over a limit today, one line per function, nested
      # if and file, with its size in the comment. New code meets the limits. A
      # line can only be removed or lowered: make lint-exceptions fails when a line
      # no longer fires, and make lint-exceptions-update rewrites the block (it
      # refuses to add a finding or raise a number). Do not edit it by hand.
      # BEGIN size exceptions
      - {path: '^cmd/duolog/calibrate\.go$', linters: [revive], text: 'file length is 1135 lines'} # cmd/duolog/calibrate.go: code lines 1135
      - {path: '^cmd/duolog/calibrate\.go$', linters: [funlen, gocognit], text: 'Function .newCalibrateClassesCommand. is too long \(63 > |complexity 30 of func .(?:\(\*?\w+\)\.)?newCalibrateClassesCommand. is'} # newCalibrateClassesCommand: lines 63, cognitive 30
