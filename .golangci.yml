version: "2"
run:
  build-tags: [e2e]
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    gocritic:
      enabled-tags: [diagnostic]
      disabled-checks:
        - filepathJoin # style: it flags every Join of a variable that may hold a separator
        - sloppyReassign # style: `err = f()` versus `:=` is a matter of taste
        - ifElseChain # style
        - weakCond # every hit is `m != nil && m[1]` on a regexp submatch, which has the group when it is not nil
    gosec:
      excludes:
        - G204 # duolog starts agents and Git by design; the arguments are built from its own config
        - G304 # duolog reads files at configured paths by design
        - G104 # errcheck reports the real unchecked errors; gosec only repeats the deliberate `_ =` ones
        # Taint analysis flags every path or command that comes from config or an
        # argument, which is all of duolog's I/O. The places that take names from
        # other agents were read and are safe: artifact refs are checked hex or a
        # cleaned, symlink-free project path, and bus reader addresses reject
        # "." and ".." and go through url.PathEscape.
        - G703
        - G702
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec]
      # Sampling for the calibration runs, not a secret.
      - path: internal/calibration/
        text: G404
        linters: [gosec]
      # .duolog/, the config and the files duolog writes into a project are meant
      # to be read by the person and by Git (0755 and 0644). Telemetry and the
      # calibration trees are not in this list, so their modes stay checked.
      - path: ^(cmd|scripts)/|^internal/(agentsync|artifact|auth|bus|capability|delegate|install|journal|learning|models|peer|runner|session|store|testbin)/
        text: G30[126]
        linters: [gosec]
      # PowerShell accepts any prefix of -recurse; the arguments are in that order on purpose.
      - path: internal/gate/gate\.go
        text: argOrder
        linters: [gocritic]
      # Tests and the test binaries start short-lived commands without a context.
      - path: _test\.go|internal/testbin/
        linters: [noctx]
      # Later PR: the production calls (git and the state lookups) need a context
      # passed through project.StateRoot, profile and the git helpers, a wide
      # signature change. Excluded until then.
      - text: .
        linters: [contextcheck, noctx]
      # An unchecked type assertion in a test panics on a wrong type, and the
      # test fails with a stack. Only the bare message matches: unchecked calls
      # name their function and stay reported.
      - path: _test\.go
        text: ^Error return value is not checked$
        linters: [errcheck]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
