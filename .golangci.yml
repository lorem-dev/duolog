version: "2"
run:
  build-tags: [e2e]
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - unconvert
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    gocritic:
      enabled-tags: [diagnostic]
    gosec:
      excludes:
        - G204 # duolog starts agents and Git by design; the arguments are built from its own config
        - G304 # duolog reads files at configured paths by design
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    presets: [std-error-handling]
    rules:
      - path: _test\.go
        linters: [gosec]
      # An unchecked type assertion in a test panics on a wrong type, and the
      # test fails with a stack. Only the bare message matches: unchecked calls
      # name their function and stay reported.
      - path: _test\.go
        text: ^Error return value is not checked$
        linters: [errcheck]
formatters:
  enable: [gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/lorem-dev/duolog]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
