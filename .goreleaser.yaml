# Release build. Check it with: goreleaser check
# Try it without publishing: goreleaser release --snapshot --clean
version: 2

project_name: duolog

# Hooks run before GoReleaser checks that dist is empty, so the installers are
# rendered to .release, which git ignores.
before:
  hooks:
    - make install-script
    - shellcheck -S error .release/install.sh

builds:
  - id: duolog
    main: ./cmd/duolog
    binary: duolog
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: duolog
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README*
      - CHANGES.md
      - THIRD-PARTY.md
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  # Include the schema and both installers in the checksums.
  extra_files:
    - glob: duolog-config.schema.json
    - glob: .release/install.sh
    - glob: .release/install.ps1

# The release body comes from CHANGES.md: --release-notes in the workflow. Keep the
# changelog enabled, because disabling it also skips that flag and leaves the body
# empty.
release:
  # A tag such as v1.2.3-rc.1 must not become the release that installers call latest.
  prerelease: auto
  # Attach the schema and both installers to the release page.
  extra_files:
    - glob: duolog-config.schema.json
    - glob: .release/install.sh
    - glob: .release/install.ps1
