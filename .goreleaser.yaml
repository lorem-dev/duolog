# Release build. Check it with: goreleaser check
# Try it without publishing: goreleaser release --snapshot --clean
version: 2

project_name: duolog

# Hooks run after --clean removes dist, before assets and checksums are built.
before:
  hooks:
    - make install-script
    - shellcheck dist/install.sh

builds:
  - id: duolog
    main: ./cmd/duolog
    binary: duolog
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: duolog
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README*
      - CHANGELOG*
      - THIRD-PARTY.md
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  # Include the schema and installer in the checksums.
  extra_files:
    - glob: duolog-config.schema.json
    - glob: dist/install.sh

release:
  # Attach the schema and installer to the release page.
  extra_files:
    - glob: duolog-config.schema.json
    - glob: dist/install.sh
