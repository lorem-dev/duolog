extends: default
ignore: |
  .worktrees/
  .cache/
  .release/
  dist/
  docs/superpowers/
  .superpowers/
rules:
  document-start: disable
  line-length: {max: 120, level: warning}
  truthy: {check-keys: false}
  quoted-strings: {quote-type: single, required: only-when-needed}
  comments: {min-spaces-from-content: 1}
  indentation: {spaces: 2, indent-sequences: consistent}
