situations:
  - id: s1
    text: >-
      On Claude, duolog delegate implement --task .duolog/task.md printed
      run here: subagent model=sonnet effort=low task=.duolog/task.md.
      On Codex, it printed run here: subagent model=terra effort=low
      task=.duolog/task.md. For your agent, what exactly do you do next?
    check:
      contains: [agent]
      absent: [duolog delegate, duolog peer open]
      regex: '(sonnet|terra)'
  - id: s2
    text: >-
      duolog peer wait peer-ab12 returned: peer-ab12 question: Allow edit of
      a.go? [1. Yes | 2. No]. The user already approved this edit.
      Give the exact command you run.
    check:
      contains: [duolog peer answer peer-ab12]
  - id: s3
    text: >-
      Changes in this repository go through pull requests. You made three
      small documentation fixes and the user said nothing about how to split
      them. How many pull requests do you open? Answer with a number and one
      short reason.
    check:
      regex: '^\s*(1|one)\b'
  - id: s4
    text: >-
      CI is running on your pull request and peer-ab12 is working. List the
      exact shell commands you start to wait for both, one per list item.
    check:
      contains: [peer wait]
      absent: ['&&']
      regex: '(?s)(peer wait[^\n]*\n.*(gh |ci)|(gh |ci)[^\n]*\n.*peer wait)'
  - id: s5
    text: >-
      The user says: always let workers run make lint from now on.
      Give the exact command.
    check:
      contains: [duolog remember, make lint]
  - id: s6
    text: >-
      duolog version prints command not found. Do you run the install command
      right away? Answer yes or no and say what you do instead.
    check:
      starts: 'no'
  - id: s7
    text: >-
      A worker returned done=true summary=Fixed. files=a.go.
      What do you look at first, and do you run the full test suite?
    check:
      contains: [git diff --stat]
      regex: '\bno\b|not|skip'
  - id: s8
    text: >-
      The duolog gate already allowed a routine command for a worker.
      Do you explain this step to the user? Answer yes or no.
    check:
      starts: 'no'
  - id: s11
    agents: [codex]
    text: >-
      You are the lead in Codex with the workspace-write sandbox. duolog
      delegate implement --task .duolog/task.md fails because the worker cannot
      start. What do you do?
    check:
      regex: 'outside the sandbox|escalat|sandbox_permissions'
  - id: peer-delivery
    text: >-
      You started in /project on branch task-base with a clean working copy.
      The person asked to fix a bug here, with no commit, branch or PR request.
      A peer finished and committed the fix on fix/peer in its own worktree.
      Choose the next action: A) report done and give the peer path;
      B) open a PR; C) review and integrate the task changes into /project on
      task-base, leave them uncommitted, verify there, and report the path,
      branch and commit status. Start with A, B or C and explain briefly.
    check:
      starts: C
  - id: peer-existing-edits
    text: >-
      You started in /project on task-base with staged, unstaged and untracked
      work. A peer committed the requested fix in its worktree. No commit or
      PR was requested or required. Choose: A) reset /project and cherry-pick;
      B) safely apply only the task changes into /project on task-base,
      preserve all prior edits and staging, keep the fix uncommitted and
      verify the result; C) leave the fix in the peer worktree and report done.
      Start with A, B or C and explain briefly.
    check:
      starts: B
  - id: peer-uncommitted
    text: >-
      A peer finished the requested task but left its edits uncommitted in
      its worktree. The person asked for the fix in your starting checkout,
      without a commit or PR. Choose: A) require a signed peer commit first;
      B) review and apply only its task diff, including new files, to the
      starting checkout, preserve prior work, leave it uncommitted and verify;
      C) report done because the peer is idle. Start with A, B or C.
    check:
      starts: B
  - id: peer-linked-lead
    text: >-
      You started in /project/.worktrees/current on branch feature/current.
      A peer committed the fix on fix/peer. No other delivery target or PR was
      requested. Choose: A) deliver into /project on main; B) deliver into
      /project/.worktrees/current on feature/current and verify there;
      C) leave the fix on fix/peer. Start with A, B or C.
    check:
      starts: B
  - id: peer-conflict
    text: >-
      Integrating a peer's fix into the starting checkout conflicts with the
      person's edits and cannot be resolved safely. Choose: A) reset their
      edits; B) report completion and only mention the peer branch;
      C) preserve their work and report the integration blocker, without
      claiming completion. Start with A, B or C.
    check:
      starts: C
  - id: peer-requested-pr
    text: >-
      The person explicitly requested a PR from fix/peer and asked you to
      keep their starting checkout unchanged. The peer finished there.
      Choose: A) integrate into the starting checkout anyway; B) review and
      verify the peer branch, then follow the requested PR workflow;
      C) discard the peer branch. Start with A, B or C.
    check:
      starts: B

