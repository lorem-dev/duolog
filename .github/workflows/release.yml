name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The tag matches every stated version
        run: uv run scripts/version/version.py check --tag "$GITHUB_REF_NAME"
      - name: Test suite
        timeout-minutes: 4
        run: go test -timeout 2m ./...
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # GoReleaser includes both installers in release assets and checksums.
      - name: Render install scripts
        run: make install-script
      - name: Check install script
        run: shellcheck -S error .release/install.sh
      - name: Write the release body from CHANGES.md
        run: uv run scripts/version/version.py notes "$GITHUB_REF_NAME" -o .release/notes.md
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=.release/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # An empty body is not an error to GoReleaser, and v1.0.0 published with one, so
      # read back what the release page really says.
      - name: The published body is the CHANGES.md section
        run: test "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body | tr -d '\r')" = "$(cat .release/notes.md)"
        env:
          GH_TOKEN: ${{ github.token }}
