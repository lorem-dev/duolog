name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: The tag matches every stated version
        run: uv run scripts/version/version.py check --tag "$GITHUB_REF_NAME"
      - name: Test suite
        timeout-minutes: 4
        run: go test -timeout 2m ./...
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # GoReleaser includes both installers in release assets and checksums.
      - name: Render install scripts
        run: make install-script
      - name: Check install script
        run: shellcheck -S error .release/install.sh
      - name: Write the release body from CHANGES.md
        run: uv run scripts/version/version.py notes "$GITHUB_REF_NAME" -o .release/notes.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes=.release/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
