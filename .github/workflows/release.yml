name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test suite
        timeout-minutes: 4
        run: go test -timeout 2m ./...
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # GoReleaser includes both installers in release assets and checksums.
      - name: Render install scripts
        run: make install-script
      - name: Check install script
        run: shellcheck -S error dist/install.sh
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
