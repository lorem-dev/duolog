name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: '-race'
          - os: ubuntu-24.04-arm
            race: '-race'
          - os: macos-latest
            race: '-race'
          - os: windows-latest
            race: '-race'
          # Go does not support the race detector on windows/arm64.
          - os: windows-11-arm
            race: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Vet
        run: go vet ./...
      # Windows checkouts may turn line endings into CRLF, which gofmt reports.
      - name: Go files are gofmt-formatted
        if: matrix.os == 'ubuntu-latest'
        run: make lint
      - name: Vet the end-to-end tests (do not run them)
        run: go vet -tags=e2e ./test/e2e/
      - name: Unit and native generated-command tests
        timeout-minutes: 14
        # Most packages take under a minute; delegate and calibration, with
        # their Git repositories, take two to four on Windows. The timeout
        # names the test that hangs and prints its stack.
        run: go test ${{ matrix.race }} -timeout 6m ./...
      # The native evidence for telemetry, by name in each runner's log: the
      # owner and mode or the Windows DACL, the macOS backup and index
      # exclusions, the Linux cache tag and NFS probe, files held open on
      # Windows, and several processes writing and pruning at once. A
      # cross-build does not prove any of it.
      - name: Native telemetry protection checks
        run: go test ${{ matrix.race }} -count=1 -v -run '^Test(Root|PruneOpenWindowsFile|PurgeOpenWindowsFile|AppendWholeLines|SaltConcurrentCreation|MaintenanceWriterPurgeRace|PruneDoesNotFollowLinks)' ./internal/telemetry
      # The NFS check above fakes statfs; this one mounts NFS over loopback
      # and checks that the real probe refuses a root there.
      - name: A real NFS mount refuses the telemetry root
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server
          sudo mkdir -p /srv/duolog-nfs /mnt/duolog-nfs
          sudo chown "$(id -u):$(id -g)" /srv/duolog-nfs
          echo "/srv/duolog-nfs 127.0.0.1(rw,sync,no_subtree_check,all_squash,anonuid=$(id -u),anongid=$(id -g))" | sudo tee /etc/exports
          sudo systemctl restart nfs-kernel-server
          sudo exportfs -ra
          sudo mount -t nfs -o vers=4 127.0.0.1:/srv/duolog-nfs /mnt/duolog-nfs
          DUOLOG_TEST_NFS_DIR=/mnt/duolog-nfs go test -count=1 -v -run '^TestRootRefusalRealNFS$' ./internal/telemetry
      - name: Every place states the same version, and CHANGES.md keeps its limits
        run: uv run scripts/version/version.py check
      - name: Version tool tests
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-project --python 3.12 --with click --with pytest python -m pytest scripts/version/tests -q -p no:cacheprovider
      - name: Generated skill copies are current
        if: matrix.os == 'ubuntu-latest'
        # The sync lock is not committed, so regenerate the copies and compare.
        run: |
          rm -rf .agents/skills
          go run ./cmd/duolog sync --from claude
          test -z "$(git status --porcelain --untracked-files=all -- .agents .codex)"
      - name: Schema is current
        run: go test . -run '^TestSchemaFileIsCurrent$'
      - name: Third-party notices are current
        run: go run ./scripts/thirdparty -check
      - name: Docs lint
        if: runner.os != 'Windows'
        run: make docs-lint
      - name: Docs lint (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @('README.md') + @(Get-ChildItem docs -Recurse -Filter '*.md' |
            Where-Object { $_.FullName -notmatch '[\\/]superpowers[\\/]' } |
            ForEach-Object { $_.FullName })
          uvx --from pymarkdownlnt==0.9.41 pymarkdown -c .pymarkdown.yaml scan @paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -run TestDocs .
      - name: Render both installers
        run: go run ./scripts/render-install
      - name: Parse installer with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD '.release/install.ps1'), [ref]$tokens, [ref]$parseErrors) > $null
          if ($parseErrors.Count) { $parseErrors; exit 1 }
      - name: Parse installer with pwsh
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD '.release/install.ps1'), [ref]$tokens, [ref]$parseErrors) > $null
          if ($parseErrors.Count) { $parseErrors; exit 1 }
      # Errors only: the PowerShell installer and launcher are checked for
      # parse errors above, and for analyzer errors here.
      - name: PSScriptAnalyzer (errors only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $failed = $false
          foreach ($path in @('scripts/dev/bin/duolog.ps1', '.release/install.ps1')) {
            $found = Invoke-ScriptAnalyzer -Path $path -Severity Error
            if ($found) { $found | Format-List; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Run POSIX installer test with dash
        if: matrix.os == 'ubuntu-latest'
        run: |
          test "$(readlink /bin/sh)" = dash
          go test ./scripts/render-install -run '^TestInstaller$' -count=1
      - name: Vulnerability check
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Shell, YAML and workflow checks, with the tools pinned in the Makefile and
  # in tools/. The formatters (make fmt-check) are not gated yet.
  lint:
    name: lint (shell, yaml, workflows, go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/actionlint/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Go modules are tidy
        run: go mod tidy -diff
      - name: Shell, YAML and workflows
        run: make lint-sh lint-yaml lint-actions
      # The tool runs on this runner; GOOS picks the files it analyses, so each
      # release OS is linted here.
      - name: Go linters (linux)
        run: GOOS=linux make lint-go
      - name: Go linters (darwin)
        run: GOOS=darwin make lint-go
      - name: Go linters (windows)
        run: GOOS=windows make lint-go
      # A size exception whose function or file was fixed must leave the list.
      - name: Size exceptions still fire
        run: make lint-exceptions

  cross-build:
    name: cross-build (all release targets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build six release targets
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          for target_os in darwin linux windows; do
            for target_arch in amd64 arm64; do
              GOOS="$target_os" GOARCH="$target_arch" go build \
                -o "$RUNNER_TEMP/duolog-$target_os-$target_arch" ./cmd/duolog
            done
          done
      # A static binary needs no libc, so it runs on musl and on very old glibc. These
      # are the systems where a dynamic build would fail first.
      - name: The Linux binary is static and runs on old systems and Alpine
        shell: bash
        run: |
          file "$RUNNER_TEMP/duolog-linux-amd64" | grep -q 'statically linked'
          for image in alpine:3.10 alpine:3.20 ubuntu:14.04 ubuntu:16.04 debian:9 centos:7; do
            echo "== $image"
            docker run --rm \
              -v "$RUNNER_TEMP/duolog-linux-amd64:/usr/local/bin/duolog-under-test:ro" \
              -v "$PWD/scripts/compat/smoke.sh:/smoke.sh:ro" \
              "$image" sh /smoke.sh /usr/local/bin/duolog-under-test
          done
      # A config check does not find a release that cannot run, so run it.
      - name: Install shellcheck for the release hooks
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # A snapshot skips the step that loads the release body, so build as a release
      # and publish nothing. The tag stays on this runner: this job cannot push.
      - name: Tag this commit on the runner
        run: |
          version=$(sed -n 's/^var version = "\(.*\)"/\1/p' cmd/duolog/main.go)
          git tag -f "v$version"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Write the release body from CHANGES.md
        run: uv run scripts/version/version.py notes "$TAG" -o .release/notes.md
      - name: Dry run of the release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean --skip=publish,announce,validate --release-notes=.release/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
